[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worker"
version = "0.1.0"
description = "Autonomous Agent Worker for Event-Driven Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "kafka-python>=2.0.2",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.4",
    "google-genai>=0.1.0",
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
